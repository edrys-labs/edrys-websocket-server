name: Release

# On every tag: build the standalone executables (build-sea.mjs), run the
# test suite against each runner's native executable, and attach the zips to
# a GitHub release. macOS executables are built on macOS, where they can be
# signed (codesign); everything else is cross-built on Linux.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platforms: linux-x64 linux-arm64 win-x64
            test: linux-x64/edrys-server-linux-x64
          - os: macos-latest
            platforms: darwin-arm64 darwin-x64
            test: darwin-arm64/edrys-server-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: OpenSSL 3 for the --ssl tests (macOS ships LibreSSL)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Build executables
        run: node build-sea.mjs $(printf -- '--platform %s ' ${{ matrix.platforms }})

      - name: Test the native executable
        run: npm test
        env:
          TEST_EXEC: edrys-executable-${{ matrix.test }}

      - name: Zip
        # zip names: edrys-server-<platform>.zip, with darwin called macos
        run: |
          for p in ${{ matrix.platforms }}; do
            zip -qr "edrys-server-${p/darwin/macos}.zip" "edrys-executable-$p"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: edrys-server-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executables-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: edrys-server-*.zip
          fail_on_unmatched_files: true
