name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint and type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run dist
          test -e dist/src/server.d.ts
          test -e dist/server.cjs

      - name: Test the built bundle
        run: npm test
        env:
          TEST_ENTRY: dist/server.cjs

  executable:
    # the standalone build, so a broken one shows up before a release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build the Linux executable
        run: node build-sea.mjs --platform linux-x64

      - name: Test it
        run: npm test
        env:
          TEST_EXEC: edrys-executable-linux-x64/edrys-server-linux-x64
